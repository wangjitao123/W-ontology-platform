 AS rn\n    FROM l3_last2 s\n    LEFT JOIN pool_last2 p ON p.augbl = s.p3_belnr AND p.kunnr = s.kunnr\n      AND ((s.ksl >= 0 AND p.ksl >= 0) OR (s.ksl < 0 AND p.ksl < 0))\n      AND p.belnr <> s.p3_belnr AND p.belnr <> s.p2_belnr AND p.belnr <> s.p1_belnr AND p.belnr <> s.belnr\n  ) x WHERE rn = 1\n),\nl5_last2 AS (\n  SELECT kunnr, belnr, docln, ksl, t_netdt, p1_belnr, p1_netdt, p1_ab, p2_belnr, p2_netdt, p2_ab, p3_belnr, p3_netdt, p3_ab, p4_belnr, p4_netdt, p4_ab,\n         c_belnr AS p5_belnr, c_netdt AS p5_netdt, c_ab AS p5_ab\n  FROM (\n    SELECT s.*, p.belnr AS c_belnr, p.netdt AS c_netdt, p.is_ab AS c_ab,\n           ROW_NUMBER() OVER (PARTITION BY s.kunnr, s.belnr, s.docln\n             ORDER BY CASE WHEN p.is_ab = 0 THEN 1 ELSE 2 END, p.netdt DESC) AS rn\n    FROM l4_last2 s\n    LEFT JOIN pool_last2 p ON p.augbl = s.p4_belnr AND p.kunnr = s.kunnr\n      AND ((s.ksl >= 0 AND p.ksl >= 0) OR (s.ksl < 0 AND p.ksl < 0))\n      AND p.belnr <> s.p4_belnr AND p.belnr <> s.p3_belnr AND p.belnr <> s.p2_belnr\n      AND p.belnr <> s.p1_belnr AND p.belnr <> s.belnr\n  ) x WHERE rn = 1\n),\ntraced_last2 AS (\n  SELECT kunnr, belnr, docln,\n         COALESCE(\n           CASE WHEN p5_ab = 0 THEN p5_netdt END,\n           CASE WHEN p4_ab = 0 THEN p4_netdt END,\n           CASE WHEN p3_ab = 0 THEN p3_netdt END,\n           CASE WHEN p2_ab = 0 THEN p2_netdt END,\n           CASE WHEN p1_ab = 0 THEN p1_netdt END,\n           p5_netdt, p4_netdt, p3_netdt, p2_netdt, p1_netdt, t_netdt\n         ) AS final_netdt\n  FROM l5_last2\n),\nbase AS (\n  SELECT kunnr, belnr, docln, name1, ksl, netdt,\n         CASE WHEN budat <= DATE_FORMAT(NOW(), '%Y%m%d')\n               AND (augbl IS NULL OR augbl = '' OR augdt > DATE_FORMAT(NOW(), '%Y%m%d'))\n              THEN 1 ELSE 0 END AS open_cur,\n         CASE WHEN budat <= DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d')\n               AND (augbl IS NULL OR augbl = '' OR augdt > DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d'))\n              THEN 1 ELSE 0 END AS open_last,\n\
    \         CASE WHEN budat <= DATE_FORMAT(DATE_SUB(DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 MONTH), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d')\n               AND (augbl IS NULL OR augbl = '' OR augdt > DATE_FORMAT(DATE_SUB(DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 MONTH), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d'))\n              THEN 1 ELSE 0 END AS open_last2\n  FROM dwh_dwd.dwd_sap_finance_open_items_tmp_30ma\n  WHERE racct IN ('1122010001','1122010002','1122010003','1221020000','2203010001','2203010002','2203010009','1122010005','1221010099','1122010004') AND kunnr NOT IN ('D00143','D00161','D00162','D00211','D00241','D00247','D10071','D60001','D60004','D60006','D60007','D60008','D60010','D60011','D60016','D60017','D60018','D60019','D60020','D60022','D60023','D60024','D60025','D60027')\n    AND kunnr IS NOT NULL AND kunnr <> ''\n    AND netdt IS NOT NULL AND netdt <> '' AND netdt <> '00000000'\n),\nfinal AS (\n  SELECT b.kunnr, b.name1, b.ksl, b.open_cur, b.open_last, b.open_last2,\n         DATEDIFF(\n           STR_TO_DATE(DATE_FORMAT(NOW(), '%Y%m%d'), '%Y%m%d'),\n           STR_TO_DATE(COALESCE(tc.final_netdt, b.netdt), '%Y%m%d')) AS aging_cur,\n         DATEDIFF(\n           STR_TO_DATE(DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d'), '%Y%m%d'),\n           STR_TO_DATE(COALESCE(tl.final_netdt, b.netdt), '%Y%m%d')) AS aging_last,\n         DATEDIFF(\n           STR_TO_DATE(DATE_FORMAT(DATE_SUB(DATE_FORMAT(DATE_SUB(DATE_FORMAT(NOW(), '%Y-%m-01'), INTERVAL 1 MONTH), '%Y-%m-01'), INTERVAL 1 DAY), '%Y%m%d'), '%Y%m%d'),\n           STR_TO_DATE(COALESCE(t2.final_netdt, b.netdt), '%Y%m%d')) AS aging_last2\n  FROM base b\n  LEFT JOIN traced_cur tc ON tc.kunnr = b.kunnr AND tc.belnr = b.belnr AND tc.docln = b.docln\n  LEFT JOIN traced_last tl ON tl.kunnr = b.kunnr AND tl.belnr = b.belnr AND tl.docln = b.docln\n  LEFT JOIN traced_last2 t2 ON t2.kunnr = b.kunnr AND t2.belnr = b.belnr AND t2.docln = b.docln\n)\nSELECT kunnr, name1, ksl,\n       CASE WHEN open_cur = 1 THEN ksl ELSE 0 END AS amt_cur,\n       CASE WHEN open_last = 1 THEN ksl ELSE 0 END AS amt_last,\n       CASE WHEN open_last2 = 1 THEN ksl ELSE 0 END AS amt_last2,\n       CASE WHEN open_cur = 1 THEN aging_cur END AS aging_cur,\n       CASE WHEN open_last = 1 THEN aging_last END AS aging_last,\n       CASE WHEN open_last2 = 1 THEN aging_last2 END AS aging_last2\nFROM final"
