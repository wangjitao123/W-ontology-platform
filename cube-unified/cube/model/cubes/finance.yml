    description: 年份
  - name: month
    title: 月份
    sql: month
    type: number
    description: 月份
  measures:
  - name: total_assets
    title: 资产总额
    sql: total_assets / 100000000
    type: sum
    description: 资产总额（亿元），企业拥有或控制的全部经济资源 ｜ 单位：亿元
    meta:
      atomic: total_assets
      grain: 报表期间 × 全集团（每期一行）
      layer: DWS
      metric_id: FIN.TOTAL_ASSETS
      owner: 财务组
      prd: 财务指标体系 v1.0
      source_table: dwh_dws.dws_cdep_financial_indicator_month
      synonyms:
      - 总资产
      - 资产规模
      - 资产总计
      usage: 报表口径
      version: v1.0
  - name: total_liabilities
