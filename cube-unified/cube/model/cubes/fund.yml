- name: fund_financing_maturity
  title: 融资到期明细（合同级）
  description: 融资到期明细（合同级）（粒度：融资合同 × 数据日期）
  # 【口径修正 2026-11-08】源表按 data_date 存快照（74 个日期，每日一份全量）。
  # 不加日期过滤直接 SUM 会把 74 天累加。本 cube 口径定义为「当前快照」。
  # 注意：注释只能写在这里（YAML 层），不能写进下面的 SQL 字符串——
  # YAML 会把换行折叠成空格，SQL 里的 `--` 会把后续条件整段注释掉。
  sql: 'SELECT data_date, maturity_date, loan_term_type, contract_no, contract_text_no, principal_balance

    FROM dwh_ads.ads_fund_financing_maturity_detail_1da

    WHERE principal_balance <> 0 AND maturity_date IS NOT NULL

      AND data_date = (SELECT MAX(data_date) FROM dwh_ads.ads_fund_financing_maturity_detail_1da)'
  dimensions:
  - name: data_date
    title: 数据日期（快照日）
    sql: data_date
    type: time
    description: '[PRD T01] 数据日期（快照日）'
  - name: maturity_date
    title: 到期日
    sql: maturity_date
    type: time
    description: 融资到期日 —— 到期分布/未来 N 个月到期本金按本维度查询（允许未来区间）
  - name: loan_term_type
    title: 期限归类
    sql: loan_term_type
    type: string
    description: short_term（短期）/ long_term（中长期）
  - name: contract_no
    title: 融资登记编号
    sql: contract_no
    type: string
    description: 融资登记编号
  - name: contract_text_no
    title: 融资合同号
    sql: contract_text_no
    type: string
    description: 融资合同号
  measures:
  - name: principal_balance
    title: 到期本金
    sql: principal_balance
    type: sum
    description: 合同级剩余待还本金（元），供到期分布/未来到期区间查询 ｜ 单位：元（展示换算万元/亿元）
    meta:
      atomic: principal_balance
      grain: 融资合同 × 数据日期
      layer: ADS
      metric_id: FUND.PRINCIPAL_BALANCE
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_financing_maturity_detail_1da
      synonyms:
      - 到期本金
      - 到期融资余额
      usage: 报表口径
      version: v1.0
