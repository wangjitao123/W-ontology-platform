    sql: fin_short
    type: sum
    description: 期限 1 年及以内的融资剩余本金（元） ｜ 单位：元（展示换算万元/亿元）
    meta:
      atomic: fin_short
      grain: 融资方式 × 数据日期
      layer: ADS
      metric_id: FUND.FIN_SHORT
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_financing_summary_1da
      synonyms:
      - 短期融资
      usage: 报表口径
      version: v1.0
  - name: fin_long
    title: 中长期融资余额
    sql: fin_long
    type: sum
    description: 期限 1 年以上的融资剩余本金（元） ｜ 单位：元（展示换算万元/亿元）
    meta:
      atomic: fin_long
      grain: 融资方式 × 数据日期
      layer: ADS
      metric_id: FUND.FIN_LONG
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_financing_summary_1da
      synonyms:
