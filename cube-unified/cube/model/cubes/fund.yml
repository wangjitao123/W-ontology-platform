# 本文件由 build_cube_model.py 从 fund_semantic.yaml 自动生成
# 不要手改 —— 改 fund_semantic.yaml 然后重跑生成脚本

cubes:
- name: fund_bank_balance
  title: 银行资金余额（银行 × 币种 × 日）
  description: 银行资金余额（银行 × 币种 × 日）（粒度：开户银行 × 币种 × 数据日期）
  sql: 'SELECT data_date, bank_name, currency_code, balance, balance_cny, rate, rate_date

    FROM dwh_ads.ads_fund_bank_balance_daily_1da

    WHERE data_date = (SELECT MAX(data_date) FROM dwh_ads.ads_fund_bank_balance_daily_1da)'
  dimensions:
  - name: data_date
    title: 数据日期（快照日）
    sql: data_date
    type: time
    description: '[PRD T01] 每日快照日期；默认查最新一天（T+1）'
  - name: bank_name
    title: 开户银行（总行）
    sql: bank_name
    type: string
    description: '[PRD T02] 取总行口径（如 中国工商银行）；没有公司/法人维度 —— 公司类问法不支持'
  - name: currency_code
    title: 币种
    sql: currency_code
    type: string
    description: '[PRD T03] CNY / USD / AUD / HKD。查 balance（原币）时必须带本维度'
  measures:
  - name: balance_cny
    title: 资金余额（折算本币）
    sql: balance_cny
    type: sum
    description: '[PRD K1] 银行账户账面余额按 T+1 汇率折算人民币后的合计（元），含外币账户；跨币种总和只能用本指标 ｜ 单位：元（展示换算万元/亿元）'
    meta:
      atomic: balance_cny
      grain: 开户银行 × 币种 × 数据日期
      id: K1
      layer: ADS
      metric_id: FUND.BALANCE_CNY
      owner: 资金组
      prd: K1
      source_table: dwh_ads.ads_fund_bank_balance_daily_1da
      synonyms:
      - 资金余额
      - 账上余额
      - 银行余额
      - 账上有多少钱
      - 可用资金
      - 账户余额
      - 资金存量
      - 资金
      - 钱
      usage: 报表口径
      version: v1.0
  - name: balance_cny_cny_only
    title: 资金余额（仅人民币账户）
    sql: CASE WHEN currency_code = 'CNY' THEN balance_cny ELSE 0 END
    type: sum
    description: 仅 CNY 本币账户的账面余额合计（元） ｜ 单位：元（展示换算万元/亿元）
    meta:
      atomic: balance_cny_cny_only
      grain: 开户银行 × 币种 × 数据日期
      layer: ADS
      metric_id: FUND.BALANCE_CNY_CNY_ONLY
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_bank_balance_daily_1da
      synonyms:
      - 人民币账户余额
      usage: 报表口径
      version: v1.0
  - name: balance
    title: 原币余额
    sql: balance
    type: sum
    description: 按币种的原币账面余额（元）。⛔ 必须带 currency_code 维度，跨币种求和非法 ｜ 单位：元（原币）
    meta:
      atomic: balance
      grain: 开户银行 × 币种 × 数据日期
      layer: ADS
      metric_id: FUND.BALANCE
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_bank_balance_daily_1da
      synonyms:
      - 原币余额
      - 外币余额
      - 美元余额
      - 欧元余额
      usage: 报表口径
      version: v1.0
- name: fund_financing
