      usage: 报表口径
      version: v1.0
  - name: fin_balance_yoy
    title: 融资余额较年初变动
    sql: fin_balance_yoy
    type: sum
    description: 当日融资余额 − 年初首日融资余额（元，ADS 预计算） ｜ 单位：元（展示换算万元/亿元）
    meta:
      atomic: fin_balance_yoy
      grain: 融资方式 × 数据日期
      layer: ADS
      metric_id: FUND.FIN_BALANCE_YOY
      owner: 资金组
      prd: 指标体系 v1.0
      source_table: dwh_ads.ads_fund_financing_summary_1da
