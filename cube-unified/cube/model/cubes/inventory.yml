cubes:
- name: aging_summary
  title: 库存库龄汇总
  description: 库存库龄汇总（粒度：记录日期 × 模块分类）
  # 【口径修正 2026-11-08】源表按 record_date 存快照（143 个日期，2026-06-17~2026-11-07）。
  # 不加日期过滤直接 SUM 会把 143 天累加，实测膨胀 89 倍（1,596 亿 vs 单日 17.9 亿）。
  # 本 cube 的口径定义为「当前快照」：只取最新 record_date 一天。
  # ⚠️ 需要看趋势/跨期对比时不能再用本 cube——那需要按 record_date 分组的独立查询。
  sql: SELECT * FROM dwh_dws.dws_sap_inv_aging_summary_1da WHERE record_date = (SELECT MAX(record_date) FROM dwh_dws.dws_sap_inv_aging_summary_1da)
  dimensions:
  - name: record_date
    title: 筛选日期
    sql: record_date
    type: time
    description: '[PRD T01] 筛选日期'
  - name: module_category
