- name: b2b_detail
  title: B2件库龄明细
  description: B2件库龄明细（粒度：记录日期 × 物料 × 工厂）
  # 【口径修正 2026-11-08】B2件库龄：源表按 record_date 存快照，不加日期过滤直接 SUM 会跨天累加。
  # 本 cube 口径定义为「当前快照」：只取最新 record_date 一天。
  # ⚠️ 趋势/跨期对比不能用本 cube，需按 record_date 分组的独立查询。
  sql: SELECT * FROM dwh_dwd.dwd_sap_inv_sap_b2b_aging_detail_1da WHERE record_date = (SELECT MAX(record_date) FROM dwh_dwd.dwd_sap_inv_sap_b2b_aging_detail_1da)
