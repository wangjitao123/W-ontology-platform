    sql: module_category
    type: string
    description: '[PRD T02] 七大模块枚举（逐字）：三电-零部件 / 整车-零部件 / 三电-自研成品 / 整车 / B2件 / 售后 / 研发'
  measures:
  - name: total_stock_value
    title: 总库存价值
    sql: total_stock_value
    type: sum
    description: '[PRD K01] 当日七大模块库存总价值，反映资金占用规模 ｜ 单位：元（展示换算万元）'
    meta:
      atomic: total_stock_value
      grain: 记录日期 × 模块分类
      id: K01
      layer: DWS
      metric_id: INVENTORY.TOTAL_STOCK_VALUE
      owner: 库存业务组
      prd: K01
      source_table: dwh_dws.dws_sap_inv_aging_summary_1da
      synonyms:
      - 库存总价值
      - 库存金额
      - 库存资金占用
      - 库存值多少钱
      usage: 报表口径
      version: v1.0
  - name: total_stock_qty
    title: 总库存数量
    sql: total_stock_qty
    type: sum
    description: '[PRD K02] 当日七大模块库存总数量。注意台/件混合口径，按模块分组展示 ｜ 单位：台/件（混合口径，见 B03）'
    meta:
