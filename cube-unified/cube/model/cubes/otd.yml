# 本文件由 build_cube_model.py 从 otd_semantic.yaml 自动生成
# 不要手改 —— 改 otd_semantic.yaml 然后重跑生成脚本

cubes:
- name: otd_plan
  title: OTD计划排产（月）
  description: OTD计划排产（月）（粒度：基地 × 生产月份（月粒度，计划口径））
  sql: SELECT * FROM dwh_ads.ads_otd_dashboard_plan
  dimensions:
  - name: base_name
    title: 基地
    sql: CASE WHEN factory_code = '1000' THEN '合肥基地' ELSE '临沂基地' END
    type: string
    description: 合肥基地(工厂1000) / 临沂基地(工厂1006+1008合计)；不指定时默认全部基地
  - name: factory_code
    title: 工厂编码
    sql: factory_code
    type: string
    description: 1000=合肥 1006/1008=临沂
  - name: factory_name
    title: 工厂名称
    sql: factory_name
    type: string
    description: 合肥基地 / 临沂基地
  - name: stat_month
    title: 生产月份
    sql: stat_month
    type: string
    description: 格式 YYYYMM，计划口径月粒度
  - name: stat_month_date
    title: 生产月份(日期型)
    sql: STR_TO_DATE(CONCAT(stat_month, '01'), '%Y%m%d')
    type: time
    description: 月粒度时间维度（趋势/区间）
  measures:
  - name: plan_qty
    title: 计划排产量
    sql: plan_qty
    type: sum
    description: 【计划口径·月粒度】当月计划生产整车数量（台），合肥/临沂分基地，取最大已提交版本 ｜ 单位：台
    meta:
      atomic: plan_qty
      grain: 基地×月
      layer: ADS
      metric_id: OTD.K01.MONTH
      owner: OTD业务组
      prd: K01/K02（合肥 / 临沂）
      source_table: dwh_ads.ads_otd_dashboard_plan
      synonyms:
      - 排产量
      - 计划排产
      - 排产计划
      - 本月排产
      usage: 汇总口径
      version: v1.0
- name: otd_daily
  title: OTD上线入库（日）
  description: OTD上线入库（日）（粒度：基地 × 统计日期（日粒度，事件口径））
  sql: SELECT * FROM dwh_ads.ads_otd_dashboard_online_inbound
  dimensions:
  - name: base_name
    title: 基地
    sql: CASE WHEN factory_code = '1000' THEN '合肥基地' ELSE '临沂基地' END
    type: string
    description: 合肥基地 / 临沂基地
  - name: factory_code
    title: 工厂编码
    sql: factory_code
    type: string
    description: 1000=合肥 1006/1008=临沂
  - name: factory_name
    title: 工厂名称
    sql: factory_name
    type: string
    description: 合肥基地 / 临沂基地
  - name: stat_date
    title: 统计日期
    sql: stat_date
    type: time
    description: 事件日粒度（上线/入库按天）
  measures:
  - name: online_qty
    title: 上线量
    sql: online_qty
    type: sum
    description: 【事件口径·日粒度】当期进入生产线的整车数量（台），一行一台车 ｜ 单位：台
    meta:
      atomic: online_qty
      grain: 基地×日
      layer: ADS
      metric_id: OTD.K03.EVENT
      owner: OTD业务组
      prd: K03/K04
      source_table: dwh_ads.ads_otd_dashboard_online_inbound
      synonyms:
      - 上线量
      - 实际上线
      - 上线多少台
      - 生产上线
      usage: 事件汇总口径
      version: v1.0
  - name: inbound_qty
    title: 入库量
    sql: inbound_qty
    type: sum
    description: 【事件口径·日粒度】当期完工入库整车数量（台），入库类型=整车采购入库（WMS） ｜ 单位：台
    meta:
      atomic: inbound_qty
      grain: 基地×日
      layer: ADS
      metric_id: OTD.K05.EVENT
      owner: OTD业务组
      prd: K05/K06
      source_table: dwh_ads.ads_otd_dashboard_online_inbound
      synonyms:
      - 入库量
      - 入库多少台
      - 整车入库
      usage: 事件汇总口径
      version: v1.0
- name: otd_distribution_plan
  title: OTD排产分布（月）
  description: OTD排产分布（月）（粒度：分布类型 × 维度值 × 基地 × 生产月份（计划口径））
  sql: SELECT * FROM dwh_ads.ads_otd_dimension_distribution
  dimensions:
  - name: distribution_type
    title: 分布类型
    sql: distribution_type
    type: string
    description: vehicle_model=车型 battery_supplier=电池供应商 edrive_supplier=电驱桥供应商
  - name: dimension_value
    title: 分布维度值
    sql: dimension_value
    type: string
    description: 车型名称或供应商名称
  - name: factory_code
    title: 工厂编码
    sql: factory_code
    type: string
    description: 1000=合肥 1006/1008=临沂
  - name: base_name
    title: 基地
    sql: CASE WHEN factory_code = '1000' THEN '合肥基地' ELSE '临沂基地' END
    type: string
    description: 合肥基地 / 临沂基地
  - name: stat_month
    title: 生产月份
    sql: stat_month
    type: string
    description: 格式 YYYYMM
  - name: stat_month_date
    title: 生产月份(日期型)
    sql: STR_TO_DATE(CONCAT(stat_month, '01'), '%Y%m%d')
    type: time
    description: 月粒度时间维度
  measures:
  - name: plan_qty
    title: 排产量分布
    sql: plan_qty
    type: sum
    description: 【计划口径·月粒度】按车型/电池供应商/电驱桥供应商分类的当月排产量（台） ｜ 单位：台
    meta:
      atomic: plan_qty
      grain: 基地×月×车型/供应商
      layer: ADS
      metric_id: OTD.K01.DIST
      owner: OTD业务组
      prd: K01/K02（合肥 / 临沂）
      source_table: dwh_ads.ads_otd_dimension_distribution
      synonyms:
      - 排产量分布
      - 车型分布
      - 供应商分布
      usage: 分布口径
      version: v1.0
