- name: otd_schedule_detail
  title: OTD排产明细
  description: OTD排产明细（粒度：物料 × 基地 × 生产月份（查询锁当月，otd 守卫强制））
  sql: SELECT * FROM dwh_ads.ads_otd_production_schedule_detail
  dimensions:
  - name: factory_code
    title: 工厂编码
    sql: factory_code
    type: string
    description: 1000=合肥 1006/1008=临沂
  - name: factory_name
    title: 工厂名称
    sql: factory_name
    type: string
    description: 合肥基地 / 临沂基地
  - name: base_name
    title: 基地
    sql: CASE WHEN factory_code = '1000' THEN '合肥基地' ELSE '临沂基地' END
    type: string
    description: 合肥基地 / 临沂基地
  - name: vehicle_model
    title: 车型
    sql: vehicle_model
    type: string
    description: 星辰404/星途405 等（⚠️ 拼接口径业务复核中，见 traps）
  - name: battery_supplier
    title: 电池供应商
    sql: battery_supplier
    type: string
    description: 特征值 ZCF 映射
  - name: edrive_supplier
    title: 电驱桥供应商
    sql: edrive_supplier
    type: string
    description: 特征值 ZCJ 映射
  - name: production_month
    title: 生产月份
    sql: production_month
    type: string
    description: 格式 YYYYMM；⚠️ 排产明细锁当月（B05）
  measures:
  - name: plan_qty
    title: 计划排产量
    sql: plan_qty
    type: sum
    description: 【计划口径·月粒度】该维度组合的当月计划排产量（台） ｜ 单位：台
    meta:
      atomic: plan_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K12.DETAIL.plan_qty
      owner: OTD业务组
      prd: K01/K02（合肥 / 临沂）
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 排产量
      usage: 明细口径
      version: v1.0
  - name: change_qty
    title: 变更量
    sql: change_qty
    type: sum
    description: 排产计划版本变更幅度（台），最大版本−最小版本，负值=计划减少 ｜ 单位：台
    meta:
      atomic: change_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K13.DETAIL
      owner: OTD业务组
      prd: K13
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 排产变更量
      - 计划调整量
      usage: 明细口径
      version: v1.0
  - name: online_qty
    title: 实际上线量
    sql: online_qty
    type: sum
    description: 【事件口径·月粒度固化】该维度组合的当月实际上线量（台） ｜ 单位：台
    meta:
      atomic: online_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K12.DETAIL.online_qty
      owner: OTD业务组
      prd: K03/K04
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 实际上线量
      usage: 明细口径
      version: v1.0
  - name: inbound_qty
    title: 入库量
    sql: inbound_qty
    type: sum
    description: 【事件口径·月粒度固化】该维度组合的当月入库量（台） ｜ 单位：台
    meta:
      atomic: inbound_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K12.DETAIL
      owner: OTD业务组
      prd: K05/K06
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 入库量
      usage: 明细口径
      version: v1.0
  - name: opening_inventory
    title: 期初库存
    sql: opening_inventory
    type: sum
    description: 当月1号整车库存快照（台） ｜ 单位：台
    meta:
      atomic: opening_inventory
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K11.DETAIL.opening_inventory
      owner: OTD业务组
      prd: K11
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 期初库存
      usage: 明细口径
      version: v1.0
  - name: return_qty
    title: 退车量
    sql: return_qty
    type: sum
    description: 当月退车量（台），一车一台，排除当天 ｜ 单位：台
    meta:
      atomic: return_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K11.DETAIL.return_qty
      owner: OTD业务组
      prd: K11
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 退车量
      usage: 明细口径
      version: v1.0
  - name: sales_plan_qty
    title: 计划销售量
    sql: sales_plan_qty
    type: sum
    description: 当月计划销售量（台），CRM 订单 type=0 且未取消、按创建时间年月、排除当天 ｜ 单位：台
    meta:
      atomic: sales_plan_qty
      grain: 基地×月×车型×供应商（锁当月）
      layer: ADS
      metric_id: OTD.K11.DETAIL.sales_plan_qty
      owner: OTD业务组
      prd: K11
      source_table: dwh_ads.ads_otd_production_schedule_detail
      synonyms:
      - 计划销售量
      - 计划销售
      usage: 明细口径
      version: v1.0
